name: Apply runtime tuning and bootless installer patch

on:
  push:
    branches:
      - agent/web-tuning-auto-flash
    paths:
      - ".github/workflows/agent_apply_tuning.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: agent/web-tuning-auto-flash

      - name: Apply deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = """"""
          Path('tools/.agent_apply.py').write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY
          python tools/.agent_apply.py
          rm -f tools/.agent_apply.py
          rmdir tools 2>/dev/null || true

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add control communication web docs README.md .github/workflows/firmware.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add runtime tuning and bootless web flashing"
          git push
