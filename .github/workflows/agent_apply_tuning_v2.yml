name: Export DIO firmware workflow patch

on:
  push:
    branches:
      - agent/web-tuning-auto-flash
    paths:
      - ".github/workflows/agent_apply_tuning_v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/web-tuning-auto-flash
      - name: Export updated workflow
        shell: bash
        run: |
          set -euo pipefail
          sed 's/--flash_mode qio/--flash_mode dio/g' .github/workflows/firmware.yml > /tmp/firmware.yml
          echo 'FIRMWARE_YML_BASE64_BEGIN'
          base64 -w0 /tmp/firmware.yml
          echo
          echo 'FIRMWARE_YML_BASE64_END'
